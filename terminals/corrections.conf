# ==============================================================================
#  terminals/corrections.conf — targeted fixes for known-broken terminals
# ==============================================================================
#
#  This file is a LAST RESORT, not the main detection path.
#
#  tmux already identifies terminal capabilities itself, and
#  capabilities/terminal.conf declares the RGB/clipboard table. This file only
#  exists for cases where a specific terminal is known to misreport something,
#  and it is deliberately short. If it ever grows to dozens of entries, the
#  detection above is wrong and should be fixed instead.
#
#  Each entry must say WHAT is broken and WHY the correction is needed.
# ==============================================================================


# --- Apple Terminal.app -------------------------------------------------------
# Reports xterm-256color but supports neither RGB nor OSC 52. Without this, a
# theme renders in approximated colours and copies vanish silently.
if-shell '[ "$TERM_PROGRAM" = "Apple_Terminal" ]' " \
  set -g @cap_truecolor 'no' ; \
  set -g @cap_osc52 'no' "

# --- Linux virtual console ----------------------------------------------------
# 8 usable colours, no italics. Box-drawing works, but the palette does not.
if-shell '[ "$TERM" = "linux" ]' " \
  set -g @cap_truecolor 'no' ; \
  set -g @cap_colors '16' "

# --- tmux inside tmux ---------------------------------------------------------
# The inner server sees TERM=screen*/tmux* from the outer one. RGB has to be
# declared explicitly or the inner session drops to 256 colours.
if-shell '[ -n "$TMUX" ]' \
  "set -as terminal-features ',screen*:RGB'"

# --- st (suckless terminal) ---------------------------------------------------
# Ships a terminfo without RGB even in builds that support it.
if-shell 'printf "%s" "$TERM" | grep -q "^st-"' \
  "set -as terminal-features ',st*:RGB'"
