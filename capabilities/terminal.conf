# ==============================================================================
#  capabilities/terminal.conf — colour depth and terminal features
# ==============================================================================
#
#  Reads:  @cfg_truecolor (auto|on|off), @cap_truecolor, @cap_colors, @cap_ssh
#
#  The tri-state resolves like this:
#
#      @cfg_truecolor  auto  ->  follow @cap_truecolor (what was detected)
#                      on    ->  force RGB even if detection said no
#                      off   ->  never advertise RGB
#
#  Forcing it on is occasionally right: a terminal behind a multiplexer or a
#  serial link may support RGB while exporting nothing that proves it.
# ==============================================================================


# ------------------------------------------------------------------------------
#  default-terminal
# ------------------------------------------------------------------------------
#  This is what tmux advertises to programs INSIDE it, and it must be a
#  screen*/tmux* entry — never xterm-256color, which would make programs think
#  they can talk directly to the outer terminal.
#
#  `tmux-256color` is correct but missing on stock macOS and some older
#  distros. `scripts/doctor` checks for it; here we fall back rather than
#  refusing to start, because a broken default-terminal makes tmux unusable.

set -g default-terminal "tmux-256color"

%if "#{!=:#{@cap_terminfo_tmux},yes}"
  set -g default-terminal "screen-256color"
%endif

# A low-colour console cannot use a 256-colour terminfo entry sensibly.
%if "#{==:#{@cap_colors},16}"
  set -g default-terminal "screen"
%endif
%if "#{==:#{@cap_colors},8}"
  set -g default-terminal "screen"
%endif


# ------------------------------------------------------------------------------
#  True colour
# ------------------------------------------------------------------------------
#  `terminal-features` (tmux 3.2+) is declarative and keyed by TERM glob, so a
#  single table serves several simultaneously attached clients correctly. That
#  matters here: capability detection reads the SERVER's environment, but each
#  client brings its own TERM, and only tmux can match per client.

%if "#{==:#{@cfg_truecolor},off}"
  # Nothing to declare. 256-colour approximations will be used.
%endif

%if "#{==:#{@cfg_truecolor},on}"
  set -as terminal-features ",*:RGB"
%endif

%if "#{==:#{@cfg_truecolor},auto}"
  # Terminals that reliably do RGB, declared by name so each attaching client
  # is matched on its own TERM rather than on the server's environment.
  set -as terminal-features ",*256col*:RGB"
  set -as terminal-features ",alacritty:RGB"
  set -as terminal-features ",contour*:RGB"
  set -as terminal-features ",foot*:RGB"
  set -as terminal-features ",ghostty*:RGB"
  set -as terminal-features ",kitty*:RGB"
  set -as terminal-features ",rio*:RGB"
  set -as terminal-features ",wezterm*:RGB"
  set -as terminal-features ",xterm-ghostty:RGB"
  set -as terminal-features ",xterm-kitty:RGB"

  # The server's own environment said RGB (COLORTERM), so trust it for the
  # common case of a single local client.
  %if "#{==:#{@cap_truecolor},yes}"
    set -asF terminal-features ",#{@cap_term}:RGB"
  %endif
%endif


# ------------------------------------------------------------------------------
#  Other terminal features
# ------------------------------------------------------------------------------
#  Undercurls and coloured underlines: used by Neovim/LSP for diagnostics.
#  Cursor style: lets Neovim show a beam in insert mode.
#  Both are harmless when unsupported — the terminal ignores the sequence.

set -as terminal-features ",*:usstyle"
set -as terminal-features ",*:cstyle"

# Clipboard capability. Declared only for terminals known to honour OSC 52,
# because advertising it to a terminal that does not causes tmux to swallow
# copies into a void instead of falling back.
set -as terminal-features ",xterm*:clipboard"
set -as terminal-features ",alacritty:clipboard"
set -as terminal-features ",contour*:clipboard"
set -as terminal-features ",foot*:clipboard"
set -as terminal-features ",ghostty*:clipboard"
set -as terminal-features ",kitty*:clipboard"
set -as terminal-features ",wezterm*:clipboard"
set -as terminal-features ",screen*:clipboard"
set -as terminal-features ",tmux*:clipboard"


# ------------------------------------------------------------------------------
#  Extended keys (CSI u)
# ------------------------------------------------------------------------------
#  Lets applications tell apart keys the legacy encoding cannot, such as
#  Ctrl-Shift-Letter. Neovim uses this when the whole chain supports it.
#
#  Default is "auto", never "always" — and the distinction matters. Forcing the
#  protocol on pushes an encoding through to Neovim that the OUTER terminal may
#  not round-trip. The failure mode is keys silently doing nothing, which is
#  far worse than not having the feature. "auto" lets tmux enable it only for
#  terminals that advertise support.

%if "#{==:#{@cfg_extended_keys},off}"
  set -s extended-keys off
%endif

%if "#{==:#{@cfg_extended_keys},on}"
  set -s extended-keys on
  set -as terminal-features ",*:extkeys"
%endif

%if "#{==:#{@cfg_extended_keys},auto}"
  # tmux negotiates: on for terminals that advertise extkeys, off otherwise.
  set -s extended-keys on
%endif
