# ==============================================================================
#  capabilities/symbols.conf — glyphs the status bar is allowed to use
# ==============================================================================
#
#  Reads:  @cfg_symbols (auto|unicode|ascii), @cap_utf8
#  Sets:   @sym_sep  @sym_dot  @sym_zoom  @sym_last  @sym_bell
#
#  WHY THIS EXISTS — this is not cosmetic. In a non-UTF-8 locale tmux replaces
#  every non-ASCII character with "_", so a status bar written with "•" and "│"
#  degrades into "session _ 1 nvim _ 19:45 _ 14.08.2026". Verified.
#
#  That situation is common exactly where it hurts: minimal containers, cron,
#  serial consoles, and SSH into a host with no locale configured. So the glyph
#  set is a capability, resolved once here, and 60-status.conf refers only to
#  these names.
#
#  No Nerd Font is ever required. The "unicode" set uses characters present in
#  essentially every modern font, not private-use-area icons.
# ==============================================================================


# --- ASCII: safe everywhere ---------------------------------------------------
%if "#{==:#{@cfg_symbols},ascii}"
  set -g @sym_sep  "|"
  set -g @sym_dot  "-"
  set -g @sym_zoom "Z"
  set -g @sym_last "-"
  set -g @sym_bell "!"
%endif

# --- Unicode: forced on ------------------------------------------------------
%if "#{==:#{@cfg_symbols},unicode}"
  set -g @sym_sep  "│"
  set -g @sym_dot  "•"
  set -g @sym_zoom "Z"
  set -g @sym_last "‹"
  set -g @sym_bell "!"
%endif

# --- Auto: follow the detected locale ----------------------------------------
%if "#{==:#{@cfg_symbols},auto}"
  %if "#{==:#{@cap_utf8},yes}"
    set -g @sym_sep  "│"
    set -g @sym_dot  "•"
    set -g @sym_zoom "Z"
    set -g @sym_last "‹"
    set -g @sym_bell "!"
  %endif
  %if "#{!=:#{@cap_utf8},yes}"
    set -g @sym_sep  "|"
    set -g @sym_dot  "-"
    set -g @sym_zoom "Z"
    set -g @sym_last "-"
    set -g @sym_bell "!"
  %endif
%endif
