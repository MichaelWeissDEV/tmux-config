# ==============================================================================
#  capabilities/detect.conf — probe the environment, set @cap_* facts
# ==============================================================================
#
#  This file DETECTS. It applies nothing. Every later module reads the `@cap_*`
#  values set here and decides what to do with them.
#
#  Sets:  @cap_os  @cap_display  @cap_ssh  @cap_utf8  @cap_truecolor
#         @cap_colors  @cap_term  @cap_terminfo_tmux  @cap_clipboard_tool
#
# ------------------------------------------------------------------------------
#  Why one script instead of a chain of if-shell
# ------------------------------------------------------------------------------
#  The tmux-native form is one `if-shell` per fact. It reads nicely, but each
#  one forks a shell: fifteen probes cost ~90 ms of server startup, measured.
#  scripts/detect does the whole probe in a single shell and applies the result
#  in a single `tmux set` call — one fork total.
#
#  `run-shell` WITHOUT `-b` is synchronous, so the options it sets ARE visible
#  to a later file's `%if`. With `-b` they are not: the option is still unset
#  when the next file is parsed. Verified against tmux 3.7. This distinction is
#  the reason the whole capability layer works.
#
# ------------------------------------------------------------------------------
#  Why detection cannot ask tmux about the client
# ------------------------------------------------------------------------------
#  `#{client_termfeatures}` and `#{client_termname}` are EMPTY while the config
#  is parsed — the server is starting and no client has attached yet. Verified.
#
#  So detection reads the process environment, and anything genuinely
#  per-client is left to tmux's own `terminal-features` table, which is keyed
#  by TERM glob and matched as each client attaches.
#  See docs/reference/capabilities.md#multiple-clients-on-one-server.
# ==============================================================================


# Safe defaults first. Without these a later `%if` reads an empty value and
# takes the wrong branch with no error. Conservative: assume the least capable
# terminal, so a failed probe degrades rather than overreaches.
set -g @cap_os             "unknown"
set -g @cap_display        "none"
set -g @cap_ssh            "no"
set -g @cap_utf8           "no"
set -g @cap_truecolor      "no"
set -g @cap_colors         "256"
set -g @cap_term           "unknown"
set -g @cap_terminfo_tmux  "no"
set -g @cap_clipboard_tool "none"

run-shell "~/.config/tmux/scripts/detect"
