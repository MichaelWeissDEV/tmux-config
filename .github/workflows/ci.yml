name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Static checks + behaviour tests on the two platforms most users are on.
  # ---------------------------------------------------------------------------
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install tmux
          else
            sudo apt-get update && sudo apt-get install -y tmux locales python3 diffutils
            # The suite asserts UTF-8 degradation, so a real UTF-8 locale must
            # exist for the positive cases to mean anything.
            sudo locale-gen en_US.UTF-8
          fi
          tmux -V

      - name: Static checks
        run: ./scripts/check

      - name: Key conflicts
        run: ./scripts/check-key-conflicts

      - name: Behaviour tests
        run: ./tests/run

      - name: Doctor (informational)
        run: ./scripts/doctor || true

  # ---------------------------------------------------------------------------
  # Distro matrix. Catches busybox/musl and minimal-image differences that a
  # GitHub runner hides — the environments where locale and clipboard tooling
  # are actually absent.
  # ---------------------------------------------------------------------------
  distros:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:stable", "fedora:latest", "archlinux:latest", "alpine:latest"]
    steps:
      - name: Install prerequisites
        shell: sh
        run: |
          if   command -v apt-get >/dev/null; then
            apt-get update && apt-get install -y tmux git ncurses-term locales python3 diffutils
          elif command -v dnf >/dev/null; then
            dnf install -y tmux git ncurses procps-ng python3 diffutils
          elif command -v pacman >/dev/null; then
            pacman -Syu --noconfirm --needed tmux git ncurses python diffutils
          elif command -v apk >/dev/null; then
            apk add --no-cache tmux git ncurses bash procps python3 diffutils
          fi
          tmux -V

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Static checks
        shell: sh
        run: ./scripts/check

      - name: Key conflicts
        shell: sh
        run: ./scripts/check-key-conflicts

      - name: Behaviour tests
        shell: sh
        run: ./tests/run

  # ---------------------------------------------------------------------------
  # The docs must build exactly as Read the Docs builds them.
  # ---------------------------------------------------------------------------
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - name: Build docs (strict — broken links fail)
        run: make -C docs dirhtml

      # The keymap and options pages are generated from the registry. If a
      # contributor changed a binding without regenerating them, the published
      # docs would silently describe something that no longer exists.
      - name: Install tmux for generator check
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Generated files are in sync
        run: |
          ./scripts/gen-options.py > docs/reference/options.md
          ./scripts/gen-keys
          ./scripts/gen-docs
          git diff --exit-code -- docs keys

  # ---------------------------------------------------------------------------
  # Upstream keymap snapshots.
  #
  # keys/upstream/ must come from tmux itself, never from a cheat sheet or from
  # memory — so the only way to add a version is to run that version and ask it.
  # This job builds each supported tmux from source and captures its keymap.
  #
  # A committed snapshot is verified byte for byte. A version with no snapshot
  # yet uploads one as an artifact for a maintainer to commit, and does not fail
  # the build: a missing snapshot is a gap in coverage, not a broken config.
  #
  # This is also what makes `scripts/check-key-conflicts` meaningful over time.
  # It asserts that prefix H — the Key Explorer — is free in EVERY captured
  # version, so each snapshot added here widens that guarantee automatically.
  # ---------------------------------------------------------------------------
  upstream-keys:
    name: tmux ${{ matrix.tmux }} keymap
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tmux: ["3.3a", "3.4", "3.5a", "3.6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build tmux ${{ matrix.tmux }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-dev libncurses-dev build-essential bison pkg-config
          curl -fsSL -o tmux.tar.gz \
            "https://github.com/tmux/tmux/releases/download/${{ matrix.tmux }}/tmux-${{ matrix.tmux }}.tar.gz"
          tar xzf tmux.tar.gz
          cd "tmux-${{ matrix.tmux }}"
          ./configure --prefix="$HOME/.local" && make -j"$(nproc)" && make install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Capture the keymap
        run: |
          tmux -V
          ./scripts/gen-upstream-keys

      - name: Compare with the committed snapshot
        run: |
          if git diff --quiet -- keys/upstream; then
            echo "snapshot for tmux ${{ matrix.tmux }} is current"
          elif git status --porcelain -- keys/upstream | grep -q '^??'; then
            echo "::notice::No snapshot for tmux ${{ matrix.tmux }} yet - see the artifact."
          else
            echo "::error::The committed snapshot for tmux ${{ matrix.tmux }} is stale."
            git diff -- keys/upstream
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keymap-${{ matrix.tmux }}
          path: keys/upstream/
          if-no-files-found: error

      # The registry rules must hold against every version we have captured,
      # not only against the newest one.
      - name: Key conflicts against this version
        run: ./scripts/check-key-conflicts
