# ==============================================================================
#  tmux.conf — entry point / loader
# ==============================================================================
#
#  This file does exactly three things:
#
#    1. Verify the tmux version is new enough.
#    2. Load the settings — shipped defaults, then YOUR `local-options.conf`.
#    3. Load every module, then your personal `local.conf` LAST.
#
#  You normally do NOT edit this file, and you do not need to edit
#  `config/00-options.conf` either:
#
#    changing an @cfg_* value   ->  local-options.conf   (read before modules)
#    adding bindings or options ->  local.conf           (read last)
#
#  Both are untracked, so they survive a `git pull`. Copy the `.example` files
#  next to them to get started.
#
#  Docs: https://tmux-config.readthedocs.io
#
# ------------------------------------------------------------------------------
#  IMPORTANT — why the load order below is not arbitrary
# ------------------------------------------------------------------------------
#
#  tmux evaluates `%if` at PARSE time, once per file, before that file runs.
#  Consequences, both verified against tmux 3.7:
#
#    * An option set in a *previously sourced* file IS visible to `%if`.   OK
#    * An option set earlier in the *same* file is NOT visible to `%if`.   TRAP
#
#  That is the whole reason `00-options.conf` is a separate file that is
#  sourced before everything else: it lets every later module branch on your
#  settings using `%if`, which costs zero shell forks. See docs/architecture.md.
#
#  Also verified: `source-file` expands `~` and `$ENV_VARS`, but NOT `#{formats}`
#  and NOT paths relative to this file. Hence the absolute `~/...` paths below.
#
# ------------------------------------------------------------------------------
#  Install location — read this before moving the directory
# ------------------------------------------------------------------------------
#
#  This config must live at `~/.config/tmux/`. That path is written out in full
#  below and in three other files (see docs/architecture.md#paths).
#
#  It genuinely cannot be auto-detected, and it is worth knowing why, because
#  every "clever" workaround fails:
#
#    * `source-file` does NOT expand `#{formats}`, so `#{d:current_file}`
#      is stored literally.
#    * Paths are NOT relative to the file doing the sourcing.
#    * `setenv` does not affect later `source-file` lines in the same run.
#    * A glob (`config/*.conf`) loads in the right order, but tmux then parses
#      all matched files as one unit, which breaks the `%if` contract above.
#
#  So: `install.sh` symlinks this repo to `~/.config/tmux`. Because it is a
#  symlink, editing the repo takes effect immediately — you do not reinstall
#  after every change.
#
#  If you must use a different location, run `./install.sh --copy` from that
#  directory, or change the path in: this file, config/20-keys.conf (the reload
#  binding), config/50-theme.conf, and config/70-plugins.conf.


# ------------------------------------------------------------------------------
#  1. Version gate
# ------------------------------------------------------------------------------
#  Minimum supported version: 3.3
#
#  We check ONCE here rather than sprinkling `if-shell` version guards through
#  the modules. Every `if-shell` forks a shell at load time; a dozen of them is
#  both measurably slower and the main reason tmux configs become unreadable.
#
#  `sort -V` is used because tmux versions are not numbers ("3.7b"), so the
#  arithmetic format operators (`#{e|<:...}`) cannot compare them.

if-shell -b '[ "$(printf "%s\n3.3\n" "$(tmux -V | sed "s/[^0-9.]//g")" | sort -V | head -n1)" != "3.3" ]' \
  'display-message -d 0 "tmux-config: needs tmux >= 3.3, found $(tmux -V). See docs/getting-started/installation.md"'


# ------------------------------------------------------------------------------
#  2. Settings — shipped defaults, then yours, both before any module
# ------------------------------------------------------------------------------
#  Load order is the whole point here:
#
#      00-options.conf      the shipped defaults
#      local-options.conf   YOUR @cfg_* values          <- not tracked by git
#      ... modules ...      every %if reads the result
#
#  `local-options.conf` exists because of the parse-time rule at the top of this
#  file. Setting `@cfg_theme` in `local.conf` cannot work: that file is sourced
#  last, long after 50-theme.conf has already been parsed and has already
#  branched on the old value. Putting your option here instead means the modules
#  genuinely see it.
#
#  Rule of thumb:
#      changing an @cfg_* value      -> local-options.conf
#      adding raw tmux commands      -> local.conf   (sourced last, section 4)

source-file -q "~/.config/tmux/config/00-options.conf"
source-file -q "~/.config/tmux/local-options.conf"


# ------------------------------------------------------------------------------
#  3. Modules
# ------------------------------------------------------------------------------
#  Sourced explicitly rather than by glob, so the order is visible and stable.
#  Each module may use `%if` against anything set in 00-options.conf.

# Detection first: it sets the @cap_* facts every later module branches on.
# Runs synchronous `if-shell` probes, which ARE visible to a later file's %if
# (backgrounded ones are not — see capabilities/detect.conf).
source-file -q "~/.config/tmux/capabilities/detect.conf"

source-file -q "~/.config/tmux/config/10-general.conf"
source-file -q "~/.config/tmux/capabilities/terminal.conf"
source-file -q "~/.config/tmux/capabilities/symbols.conf"
source-file -q "~/.config/tmux/terminals/corrections.conf"
source-file -q "~/.config/tmux/config/20-keys.conf"
source-file -q "~/.config/tmux/config/30-copy-mode.conf"
source-file -q "~/.config/tmux/config/40-clipboard.conf"
source-file -q "~/.config/tmux/config/50-theme.conf"
source-file -q "~/.config/tmux/config/60-status.conf"
source-file -q "~/.config/tmux/config/70-plugins.conf"


# ------------------------------------------------------------------------------
#  4. Your personal overrides — always last, so they win
# ------------------------------------------------------------------------------
#  Not tracked by git. Copy `local.conf.example` to `local.conf` to start.
#  `-q` means "no error if the file does not exist", so this is safe to leave in.

source-file -q "~/.config/tmux/local.conf"
