# ==============================================================================
#  10-general.conf — terminal, colours, core behaviour
# ==============================================================================
#
#  Reads:  @cfg_mouse, @cfg_base_index, @cfg_renumber_windows,
#          @cfg_automatic_rename, @cfg_history_limit, @cfg_escape_time,
#          @cfg_repeat_time, @cfg_focus_events, @cfg_dim_inactive
#
#  Two mechanisms are used to apply your settings, both fork-free:
#
#    set -gF option "#{@cfg_x}"   pass a value straight through
#    %if "#{==:#{@cfg_x},on}"     branch when a setting needs several lines
#
#  `set -F` expands formats in the value. Without `-F` the literal text
#  "#{@cfg_x}" would be stored, which is a common and very confusing bug.
# ==============================================================================


#  NOTE: terminal, colour and glyph handling moved to capabilities/.
#  They depend on detection results, so they must load after detect.conf.
#  See capabilities/terminal.conf and capabilities/symbols.conf.


# ------------------------------------------------------------------------------
#  Core behaviour
# ------------------------------------------------------------------------------

set -gF  mouse            "#{@cfg_mouse}"
set -gF  history-limit    "#{@cfg_history_limit}"
set -gF  repeat-time      "#{@cfg_repeat_time}"
set -gF  focus-events     "#{@cfg_focus_events}"

# escape-time is a SERVER option (`-s`), not a session option.
# Low value = Neovim leaves insert mode instantly. See docs/configuration/index.md.
set -sF  escape-time      "#{@cfg_escape_time}"

# Numbering. base-index is a session option, pane-base-index a window option;
# they must be set separately or your panes and windows start at different
# numbers, which is a classic source of confusion.
set  -gF base-index       "#{@cfg_base_index}"
setw -gF pane-base-index  "#{@cfg_base_index}"

set -gF  renumber-windows "#{@cfg_renumber_windows}"

# Window naming. Both options must agree, otherwise a shell escape sequence can
# still rename the window behind your back.
set  -gF automatic-rename "#{@cfg_automatic_rename}"
set  -gF allow-rename     "#{@cfg_automatic_rename}"

# Resize to the smallest client only for windows actually shown by several
# clients, rather than shrinking every window to the smallest attached terminal.
setw -g aggressive-resize on

# Do not detach the client when the last session it shows is destroyed;
# switch it to another session instead.
set -g detach-on-destroy off

# How long status messages (like "config reloaded") stay on screen, in ms.
# tmux defaults to 750, which is too quick to read an error.
set -g display-time 2000


# ------------------------------------------------------------------------------
#  Activity & bells
# ------------------------------------------------------------------------------
#  Quiet by default. The window list still highlights activity (see the theme),
#  but nothing interrupts you with a message or a beep.

set -g monitor-activity on
set -g visual-activity  off
set -g visual-bell      off
set -g visual-silence   off
set -g bell-action      none


# ------------------------------------------------------------------------------
#  Inactive pane dimming (optional)
# ------------------------------------------------------------------------------
#  `%if` on an option set in 00-options.conf: legal, because that file was
#  sourced before this one. See tmux.conf for why the reverse does not work.

%if "#{==:#{@cfg_dim_inactive},on}"
  setw -g window-style        "fg=colour247"
  setw -g window-active-style "fg=colour255"
%endif
