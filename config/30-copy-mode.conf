# ==============================================================================
#  30-copy-mode.conf — selecting and yanking text
# ==============================================================================
#
#  Reads:  @cfg_mode_keys, @cfg_copy_stays_in_mode
#
#  SCOPE — this matters and is widely misunderstood:
#  Everything in the `copy-mode-vi` key table applies ONLY while you are inside
#  tmux's copy mode. It has zero effect on Neovim, on your shell, or on any
#  program running in a pane. Setting `mode-keys vi` does not "make tmux vi
#  mode" — it only changes copy mode's own keys.
#
#  Enter copy mode with `prefix + [`, or by scrolling up with the mouse.
#  Leave it with `q` or `Escape`. Both are tmux defaults and are not re-bound.
# ==============================================================================


setw -gF mode-keys "#{@cfg_mode_keys}"


# ------------------------------------------------------------------------------
#  Selection — vi style
# ------------------------------------------------------------------------------
#  ONE key is changed here, and it is the only copy-mode default this config
#  displaces anywhere: `v` starts a selection.
#
#  tmux binds `v` to rectangle-toggle. That is defensible, but every vi user
#  arrives with `v` meaning "begin visual selection", and copy mode is where
#  that muscle memory is strongest. rectangle-toggle keeps its other, more
#  widely used key, C-v, which this config does not touch.
#
#  Not rebound, because tmux already binds them exactly as vi does:
#    Space  begin-selection      V     select-line
#    C-v    rectangle-toggle     0 / $ start / end of line
#    H/M/L  top / middle / bottom of the screen — real vi semantics
#    C-u / C-d   half page up / down
#    q      cancel               Escape  clear the selection

%if "#{==:#{@cfg_mode_keys},vi}"
  bind -T copy-mode-vi -N "Start a selection" v send-keys -X begin-selection
%endif


# ------------------------------------------------------------------------------
#  Yanking
# ------------------------------------------------------------------------------
#  `copy-pipe-and-cancel` with no argument pipes through `copy-command`, which
#  40-clipboard.conf sets to the right tool for your OS. That indirection is
#  why there is no pbcopy/xclip/clip.exe hardcoded anywhere in this file.
#
#  `y` is an addition — tmux leaves it free. Enter and the mouse drag are
#  tmux's own copy keys and are left alone UNLESS you ask to stay in copy mode
#  after yanking, which is the one thing that genuinely changes their result.

bind -T copy-mode-vi -N "Copy the selection and leave copy mode" y send-keys -X copy-pipe-and-cancel

%if "#{==:#{@cfg_copy_stays_in_mode},on}"
  bind -T copy-mode-vi -N "Copy the selection and stay in copy mode" y     send-keys -X copy-pipe
  bind -T copy-mode-vi -N "Copy the selection and stay in copy mode" Enter send-keys -X copy-pipe
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe
%endif

# Click without dragging clears the selection instead of leaving it stuck on
# screen. Without this, a stray click leaves a highlighted region behind.
bind -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection


# ------------------------------------------------------------------------------
#  Searching
# ------------------------------------------------------------------------------
#  On C-f, not `/`. tmux binds `prefix /` to describe-key — press it, then
#  press any key, and tmux tells you what that key does. Taking `/` for search
#  would remove one of tmux's few built-in help affordances, which is exactly
#  the sort of thing this project refuses to do.
#
#  `f` for find, matching tmux's own `prefix f` (find-window).

bind -N "Search the scrollback" C-f copy-mode \; send-keys -X search-backward ""

# Jump straight to the previous shell prompt. Needs your shell to emit OSC 133
# prompt markers (zsh with a modern prompt, fish, and starship do this).
bind -N "Jump to the previous prompt" C-p copy-mode \; send-keys -X previous-prompt


# ------------------------------------------------------------------------------
#  Scrolling
# ------------------------------------------------------------------------------
#  Mouse wheel enters copy mode and scrolls by 3 lines instead of a full page,
#  which feels much closer to a normal terminal.

bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 3 scroll-down

# Half-page jumps (C-u / C-d) are not bound here — tmux already binds them
# exactly as vi does.
