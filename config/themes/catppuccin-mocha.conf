# ==============================================================================
#  Catppuccin Mocha (dark)  —  https://github.com/catppuccin/catppuccin
# ==============================================================================
#  Every theme defines exactly these ten variables. 60-status.conf renders the
#  status bar using only these names, so a theme never touches layout.
#  To make your own: copy this file to custom.conf and change the hex values.
# ==============================================================================

set -g @thm_bg      "#181825"   # status bar background
set -g @thm_surface "#313244"   # raised blocks: active window, messages
set -g @thm_fg      "#cdd6f4"   # primary text
set -g @thm_muted   "#a6adc8"   # secondary text: inactive window names, clock
set -g @thm_subtle  "#585b70"   # separators, window numbers, borders

set -g @thm_accent  "#89b4fa"   # session name, active window, active border
set -g @thm_urgent  "#f38ba8"   # bells, prefix indicator
set -g @thm_warn    "#f9e2af"   # activity in a background window
set -g @thm_ok      "#a6e3a1"   # zoom / copy-mode indicator
set -g @thm_border  "#313244"   # inactive pane borders
