# ==============================================================================
#  50-theme.conf — theme loader
# ==============================================================================
#
#  Reads:  @cfg_theme
#
#  This file only picks WHICH palette to load. It defines no colours itself.
#  The palette files in config/themes/ define a fixed set of `@thm_*` variables.
#  60-status.conf renders the bar purely in terms of those variables.
#
#  That separation is the point: a new theme is a ~20 line file and touches
#  nothing else. See docs/customization/themes.md.
#
#  `source-file` cannot expand formats, so the theme name cannot be
#  interpolated into the path — hence the explicit `%if` chain below. It is
#  parse-time and costs no shell forks.
# ==============================================================================


%if "#{==:#{@cfg_theme},catppuccin-mocha}"
  source-file -q "~/.config/tmux/config/themes/catppuccin-mocha.conf"
%endif

%if "#{==:#{@cfg_theme},catppuccin-latte}"
  source-file -q "~/.config/tmux/config/themes/catppuccin-latte.conf"
%endif

%if "#{==:#{@cfg_theme},tokyonight}"
  source-file -q "~/.config/tmux/config/themes/tokyonight.conf"
%endif

%if "#{==:#{@cfg_theme},nord}"
  source-file -q "~/.config/tmux/config/themes/nord.conf"
%endif

%if "#{==:#{@cfg_theme},gruvbox-dark}"
  source-file -q "~/.config/tmux/config/themes/gruvbox-dark.conf"
%endif

%if "#{==:#{@cfg_theme},rose-pine}"
  source-file -q "~/.config/tmux/config/themes/rose-pine.conf"
%endif

# Your own palette. Create config/themes/custom.conf (it is gitignored) by
# copying a file above, then set @cfg_theme "custom" in local-options.conf.
%if "#{==:#{@cfg_theme},custom}"
  source-file -q "~/.config/tmux/config/themes/custom.conf"
%endif
