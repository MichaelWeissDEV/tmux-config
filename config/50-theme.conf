# ==============================================================================
#  50-theme.conf — theme loader
# ==============================================================================
#
#  Reads:  @cfg_theme
#
#  This file only picks WHICH palette to load. It defines no colours itself.
#  The palette files in config/themes/ define a fixed set of `@thm_*` variables.
#  60-status.conf renders the bar purely in terms of those variables.
#
#  That separation is the point: a new theme is a ~20 line file and touches
#  nothing else. See docs/customization/themes.md.
#
# Optionally, create config/themes/custom.conf by copying an existing theme,
# then set @cfg_theme to "custom" in local-options.conf (custom.conf is
# ignored by git).
#
# Alternatively, set @cfg_theme_file to specify the complete path to your own
# theme file (e.g. set -g @cfg_theme_file "~/.dotfiles/mytheme.conf").
# ==============================================================================

%if "#{!=:#{@cfg_theme_file},}"
  source-file -F "#{@cfg_theme_file}"
%elif "#{!=:#{@cfg_theme},}"
  source-file -F "~/.config/tmux/config/themes/#{@cfg_theme}.conf"
%endif
