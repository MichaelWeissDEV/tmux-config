# ==============================================================================
#  40-clipboard.conf — OS clipboard integration
# ==============================================================================
#
#  Reads:  @cfg_system_clipboard, @cfg_osc52, @cap_clipboard_tool
#  Sets:   copy-command  (used by every copy binding in 30-copy-mode.conf)
#
#  This file does NO detection of its own — capabilities/detect.conf already
#  resolved which helper exists on this machine. Everything below is a
#  parse-time `%if`, so this file forks nothing at load.
#
#  There are two independent paths to your clipboard, and knowing which one is
#  doing the work saves a lot of debugging:
#
#    1. copy-command — runs a local helper (pbcopy, wl-copy, xclip, clip.exe).
#       Works only where tmux itself runs. Over SSH this puts text on the
#       REMOTE machine's clipboard, which is almost never what you want.
#
#    2. OSC 52 — tmux emits an escape sequence that asks your terminal
#       emulator to set the clipboard. This crosses SSH, because the terminal
#       is on your local machine. Requires terminal support.
#
#  Both are enabled by default. They are complementary, not redundant.
# ==============================================================================


# ------------------------------------------------------------------------------
#  OSC 52 — clipboard over SSH
# ------------------------------------------------------------------------------
#  on       = tmux sets the clipboard and forwards to the outer terminal
#  external = only forward outward, never set tmux's own buffer
#  off      = disabled
#
#  Terminal support: Ghostty, kitty, WezTerm, Alacritty, foot, iTerm2,
#  Windows Terminal, and xterm (needs allowWindowOps). Apple's Terminal.app
#  does NOT support it — terminals/corrections.conf flags that case.

set -gF set-clipboard "#{@cfg_osc52}"

# Allow programs inside panes (Neovim's OSC 52 provider, for instance) to reach
# the clipboard through tmux as well. tmux 3.3+.
set -g allow-passthrough on


# ------------------------------------------------------------------------------
#  copy-command — the local clipboard helper
# ------------------------------------------------------------------------------
#  Selected from the already-detected platform. scripts/detect confirmed the
#  tool actually exists before naming it, so nothing is probed here.

%if "#{==:#{@cfg_system_clipboard},on}"

  # scripts/detect already resolved which helper exists on this machine, so
  # there is nothing left to probe — this is a pure pass-through with no fork.
  #
  # "none" is a valid outcome, not a failure: a headless box or a container has
  # no local clipboard, and copying still works through OSC 52 and tmux's own
  # buffers. Setting copy-command to "none" would break that, so it is skipped.
  %if "#{!=:#{@cap_clipboard_tool},none}"
    set -gF copy-command "#{@cap_clipboard_tool}"
  %endif

%endif


# ------------------------------------------------------------------------------
#  Paste
# ------------------------------------------------------------------------------
#  Nothing is bound here, deliberately. tmux's buffer keys are already good:
#
#    prefix ]   paste the most recent buffer
#    prefix =   choose a buffer to paste from
#    prefix #   list the buffers
#    prefix -   delete the most recent buffer
#
#  An earlier version of this config put paste on `prefix p` and the chooser on
#  `prefix P`. `p` is tmux's previous-window — a navigation key most people use
#  far more often than paste — so that was a takeover, not an improvement, and
#  it is gone. See docs/keybindings/complete.md for the full buffer table.
#
#  To paste from the OS clipboard, use your terminal's normal shortcut
#  (Cmd+V / Ctrl+Shift+V) — that path never goes through tmux at all.
