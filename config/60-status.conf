# ==============================================================================
#  60-status.conf — status bar layout
# ==============================================================================
#
#  Reads:  @cfg_status_position, @cfg_status_interval, @cfg_status_style,
#          @cfg_show_session, @cfg_clock_format, @cfg_date_format,
#          @cfg_pane_border_lines, and every @thm_* from the active theme.
#
#  No hex colour appears in this file. Every colour is `#{@thm_*}`, resolved
#  from whichever theme 50-theme.conf loaded. That indirection is what lets you
#  switch themes by changing one word in 00-options.conf.
#
#  No `#(shell command)` appears here either — that is deliberate. A `#()` in
#  the status bar forks a process on every refresh, for every attached client.
#  It is the single biggest performance mistake in most tmux configs.
#  See docs/configuration/index.md#status-bar-performance before adding one.
#
#  Glyphs come from capabilities/symbols.conf as `#{@sym_*}`, never written
#  literally here. In a non-UTF-8 locale tmux replaces non-ASCII with "_", so
#  the glyph set is resolved as a capability and degrades to ASCII on its own.
#  No Nerd Font required — docs/customization/themes.md#icons covers powerline separators.
# ==============================================================================


set -g status on
set -gF status-position "#{@cfg_status_position}"
set -gF status-interval "#{@cfg_status_interval}"
set -g  status-justify  left

set -g status-style "bg=#{@thm_bg},fg=#{@thm_fg}"

# Clear the inherited styles so the left/right segments are styled only by the
# `#[...]` markup below. Without this, a stale bg from a previous config can
# bleed through after a reload.
set -g status-left-style  "none"
set -g status-right-style "none"


# ------------------------------------------------------------------------------
#  Left — session name and prefix indicator
# ------------------------------------------------------------------------------
#  `#{?client_prefix,A,B}` is a tmux conditional: it shows A while the prefix
#  key is armed and B otherwise. It makes "did my prefix register?" obvious,
#  which removes most accidental keystrokes.

set -g status-left-length 40

%if "#{==:#{@cfg_show_session},on}"
  set -g status-left \
    "#{?client_prefix,#[bg=#{@thm_urgent}],#[bg=#{@thm_accent}]}#[fg=#{@thm_bg},bold] #S #[default] "
%endif

%if "#{!=:#{@cfg_show_session},on}"
  set -g status-left " "
%endif


# ------------------------------------------------------------------------------
#  Windows
# ------------------------------------------------------------------------------
#  Inactive windows are muted; the current one gets a raised surface block and
#  the accent colour. Activity in a background window turns its number amber,
#  a bell turns it red.

set -g window-status-separator ""

set -g window-status-format \
  "#[fg=#{@thm_subtle},bg=#{@thm_bg}] #I #[fg=#{@thm_muted}]#W#{?window_last_flag,#[fg=#{@thm_subtle}]#{@sym_last},} "

set -g window-status-current-format \
  "#[fg=#{@thm_accent},bg=#{@thm_surface},bold] #I #[fg=#{@thm_fg}]#W#{?window_zoomed_flag,#[fg=#{@thm_ok}] #{@sym_zoom},} #[default]"

# Background window that printed something since you last looked.
set -g window-status-activity-style "fg=#{@thm_warn},bg=#{@thm_bg}"
set -g window-status-bell-style     "fg=#{@thm_urgent},bg=#{@thm_bg},bold"


# ------------------------------------------------------------------------------
#  Right — depends on @cfg_status_style
# ------------------------------------------------------------------------------
#  minimal  : nothing
#  default  : clock + date
#  detailed : adds hostname
#
#  The date segment collapses automatically when @cfg_date_format is "".

set -g status-right-length 80

%if "#{==:#{@cfg_status_style},minimal}"
  set -g status-right ""
%endif

#  NOTE — why the clock is wrapped in `#{T:...}`:
#  tmux runs strftime over the status string BEFORE it resolves `#{@variables}`.
#  A "%H:%M" arriving through `#{@cfg_clock_format}` therefore lands after that
#  pass and would be printed literally as "%H:%M". `#{T:...}` forces a second,
#  explicit time expansion on the resolved value. Verified against tmux 3.7.

%if "#{==:#{@cfg_status_style},default}"
  set -g status-right \
    "#[fg=#{@thm_muted}]#{T:#{@cfg_clock_format}}#{?#{@cfg_date_format},#[fg=#{@thm_subtle}] #{@sym_dot} #[fg=#{@thm_muted}]#{T:#{@cfg_date_format}},} "
%endif

%if "#{==:#{@cfg_status_style},detailed}"
  set -g status-right \
    "#{?#{@cap_os},#[fg=#{@thm_subtle}]#{@cap_os} #{@sym_dot} ,}#[fg=#{@thm_accent}]#h#[fg=#{@thm_subtle}] #{@sym_sep} #[fg=#{@thm_muted}]#{T:#{@cfg_clock_format}}#{?#{@cfg_date_format},#[fg=#{@thm_subtle}] #{@sym_dot} #[fg=#{@thm_muted}]#{T:#{@cfg_date_format}},} "
%endif


# ------------------------------------------------------------------------------
#  Panes
# ------------------------------------------------------------------------------

set -gF pane-border-lines "#{@cfg_pane_border_lines}"
set -g  pane-border-style        "fg=#{@thm_border}"
set -g  pane-active-border-style "fg=#{@thm_accent}"

# Per-pane title bars are off: they cost a line of height per pane and repeat
# information the status bar already carries. Turn on with `top` if you want
# them (e.g. when you name panes for a demo).
set -g pane-border-status off

# Big pane numbers shown by `prefix + q`.
#
# `-F` IS REQUIRED HERE. These are colour-typed options, not style options:
# tmux validates the value at set time and does NOT expand formats in it.
# Without -F you get "bad colour: #{@thm_subtle}" and tmux keeps its default,
# so the setting silently does nothing.
#
# Style options (`*-style`) are the opposite — they are expanded when drawn,
# so "fg=#{@thm_accent}" works there without -F. That asymmetry is easy to
# trip over. `scripts/check` catches it via `source-file -n`.
set -g  display-panes-time          1000
set -gF display-panes-colour        "#{@thm_subtle}"
set -gF display-panes-active-colour "#{@thm_accent}"


# ------------------------------------------------------------------------------
#  Messages, prompts and modes
# ------------------------------------------------------------------------------

set -g message-style         "bg=#{@thm_surface},fg=#{@thm_fg}"
set -g message-command-style "bg=#{@thm_surface},fg=#{@thm_fg}"

# Interactive lists: choose-tree, choose-buffer, the key table in `prefix + ?`.
set -g menu-style          "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g menu-selected-style "bg=#{@thm_surface},fg=#{@thm_accent},bold"
set -g menu-border-style   "fg=#{@thm_border}"
set -g popup-style         "bg=#{@thm_bg}"
set -g popup-border-style  "fg=#{@thm_border}"

# The copy-mode selection / search-match highlight.
set -g mode-style "bg=#{@thm_accent},fg=#{@thm_bg}"
set -g copy-mode-match-style         "bg=#{@thm_warn},fg=#{@thm_bg}"
set -g copy-mode-current-match-style "bg=#{@thm_urgent},fg=#{@thm_bg},bold"
set -g copy-mode-mark-style          "bg=#{@thm_ok},fg=#{@thm_bg}"

# Clock mode (`prefix + t`). Colour-typed, so -F again — see the note above.
set -gF clock-mode-colour "#{@thm_accent}"
set -g  clock-mode-style  24
