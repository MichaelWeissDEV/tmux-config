# ==============================================================================
#  20-keys.conf — prefix, panes, windows, sessions
# ==============================================================================
#
#  Reads:  @cfg_prefix, @cfg_keep_default_prefix, @cfg_vi_pane_keys,
#          @cfg_alt_window_keys, @cfg_plugin_navigator
#
#  Notation:
#    bind      = requires the prefix first
#    bind -n   = no prefix, pressed directly (uses up a global key!)
#    bind -r   = repeatable within @cfg_repeat_time without re-pressing prefix
#
#  Bindings tmux already provides by default are NOT repeated here. Re-binding
#  a key to its own default is pure noise and makes a config look larger than
#  it is. Run `prefix + ?` to see everything currently bound.
# ==============================================================================


# ------------------------------------------------------------------------------
#  Prefix
# ------------------------------------------------------------------------------

%if "#{!=:#{@cfg_prefix},C-b}"
  unbind C-b
  set -gF prefix "#{@cfg_prefix}"

  # Press the prefix twice to send it through to the program inside the pane
  # (nested tmux, or C-a in a shell).
  #
  # `bind` does not expand formats in the key argument, so the key cannot be
  # written as "#{@cfg_prefix}" directly. run-shell does expand them, which
  # keeps this correct for any prefix — not just C-a.
  run-shell -b 'tmux bind -N "Send the prefix key through to the pane" "#{@cfg_prefix}" send-prefix'
%endif

%if "#{==:#{@cfg_keep_default_prefix},on}"
  set -g prefix2 C-b
  bind -N "Send C-b through to the pane" C-b send-prefix -2
%endif


# ------------------------------------------------------------------------------
#  Config reload
# ------------------------------------------------------------------------------
#  The path matches TMUX_HOME in tmux.conf. If you moved the config, change it
#  there and here.

bind -N "Reload the tmux config" r \
  source-file ~/.config/tmux/tmux.conf \; \
  display-message "  config reloaded"


# ------------------------------------------------------------------------------
#  Splits
# ------------------------------------------------------------------------------
#  `|` and `-` are mnemonic: the character looks like the split it makes.
#  `-c "#{pane_current_path}"` opens the new pane in the SAME directory as the
#  current one — tmux's default is your home directory, which is rarely wanted.

bind -N "Split horizontally (side by side)" | split-window -h -c "#{pane_current_path}"
bind -N "Split vertically (stacked)"        - split-window -v -c "#{pane_current_path}"

# Full-width / full-height splits across the whole window.
bind -N "Split full width (stacked)"        _ split-window -fv -c "#{pane_current_path}"
bind -N "Split full height (side by side)" '\' split-window -fh -c "#{pane_current_path}"

# Keep tmux's default % and " working, but fix their directory behaviour too.
bind -N "Split horizontally (side by side)" % split-window -h -c "#{pane_current_path}"
bind -N "Split vertically (stacked)"       '"' split-window -v -c "#{pane_current_path}"

# New window in the current directory, same reasoning.
bind -N "New window in the current directory" c new-window -c "#{pane_current_path}"


# ------------------------------------------------------------------------------
#  Pane navigation
# ------------------------------------------------------------------------------

%if "#{==:#{@cfg_vi_pane_keys},on}"
  bind -N "Select pane to the left"  h select-pane -L
  bind -N "Select pane below"        j select-pane -D
  bind -N "Select pane above"        k select-pane -U
  bind -N "Select pane to the right" l select-pane -R
%endif

# Resize. Repeatable (`-r`), so you can hold the direction and nudge.
# Capital letters, so they do not clash with the navigation keys above.
bind -r -N "Resize pane left"  H resize-pane -L 5
bind -r -N "Resize pane down"  J resize-pane -D 5
bind -r -N "Resize pane up"    K resize-pane -U 5
bind -r -N "Resize pane right" L resize-pane -R 5

bind -N "Zoom the current pane in/out" z resize-pane -Z
bind -N "Balance panes horizontally"  = select-layout even-horizontal
bind -N "Balance panes vertically"    + select-layout even-vertical

# Move a pane out into its own window, and pull one back in.
bind -N "Break the pane into a new window" ! break-pane -d
bind -N "Join a pane from another window"  @ choose-window "join-pane -h -s '%%'"


# ------------------------------------------------------------------------------
#  Window navigation
# ------------------------------------------------------------------------------

bind -r -N "Previous window" C-h previous-window
bind -r -N "Next window"     C-l next-window

# Move the current window left/right in the window list.
bind -r -N "Move window left"  '<' swap-window -d -t -1
bind -r -N "Move window right" '>' swap-window -d -t +1

bind -N "Jump to the last used window" Tab last-window

# Alt+number window switching, no prefix needed.
#
# TRADEOFF: `-n` bindings are global — tmux swallows these keys before the
# program in the pane ever sees them. Alt+1..9 is used by terminal browsers,
# some TUI apps, and Windows Terminal's own tab switching. Set
# @cfg_alt_window_keys to "off" in 00-options.conf if that bites you.

%if "#{==:#{@cfg_alt_window_keys},on}"
  bind -n -N "Go to window 1" M-1 select-window -t :=1
  bind -n -N "Go to window 2" M-2 select-window -t :=2
  bind -n -N "Go to window 3" M-3 select-window -t :=3
  bind -n -N "Go to window 4" M-4 select-window -t :=4
  bind -n -N "Go to window 5" M-5 select-window -t :=5
  bind -n -N "Go to window 6" M-6 select-window -t :=6
  bind -n -N "Go to window 7" M-7 select-window -t :=7
  bind -n -N "Go to window 8" M-8 select-window -t :=8
  bind -n -N "Go to window 9" M-9 select-window -t :=9
%endif


# ------------------------------------------------------------------------------
#  Neovim integration (vim-tmux-navigator)
# ------------------------------------------------------------------------------
#  Ctrl+hjkl moves between tmux panes AND Neovim splits with the same keys.
#  Needs the Neovim-side plugin as well — see docs/plugins.md#neovim-integration.
#
#  How it works: tmux asks "is the running program vim/nvim?" by matching the
#  process name. If yes, the key is passed through untouched and Neovim handles
#  it; if no, tmux moves the pane itself.

%if "#{==:#{@cfg_plugin_navigator},on}"
  is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|n?vim?x?)(-wrapped)?(diff)?$'"

  bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
  bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
  bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
  bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

  bind -T copy-mode-vi C-h select-pane -L
  bind -T copy-mode-vi C-j select-pane -D
  bind -T copy-mode-vi C-k select-pane -U
  bind -T copy-mode-vi C-l select-pane -R
%endif


# ------------------------------------------------------------------------------
#  Sessions
# ------------------------------------------------------------------------------

bind -N "Choose a session from a list" S choose-tree -Zs
bind -N "Rename the current session"   '$' command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Detach from the session"      d detach-client

# A scratch/popup shell over the current window (tmux 3.2+).
# Great for a quick command without disturbing your layout — press again or
# Ctrl-d to dismiss.
bind -N "Toggle a floating scratch terminal" g \
  display-popup -E -w 80% -h 75% -d "#{pane_current_path}"


# ------------------------------------------------------------------------------
#  Misc
# ------------------------------------------------------------------------------

bind -N "Toggle the status bar" b set -g status

# Clear both the visible screen and the scrollback buffer.
bind -N "Clear screen and history" C-k send-keys -R \; clear-history \; \
  display-message "  screen and history cleared"
