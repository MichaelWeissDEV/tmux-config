# ==============================================================================
#  20-keys.conf — prefix, panes, windows, sessions
# ==============================================================================
#
#  Reads:  @cfg_prefix, @cfg_keep_default_prefix, @cfg_vi_pane_keys,
#          @cfg_alt_window_keys, @cfg_plugin_navigator
#
#  Notation:
#    bind      = requires the prefix first
#    bind -n   = no prefix, pressed directly (uses up a global key!)
#    bind -r   = repeatable within @cfg_repeat_time without re-pressing prefix
#
# ------------------------------------------------------------------------------
#  THE RULE THIS FILE FOLLOWS
# ------------------------------------------------------------------------------
#  tmux stays tmux. A default binding may be IMPROVED — same purpose, better
#  behaviour — but it is never given a different job. So you will not find
#  `-` bound to a split here, because tmux uses it for delete-buffer, nor `r`
#  bound to a config reload, because tmux uses it for refresh-client.
#
#  Every binding below is registered in keys/custom/, and
#  `scripts/check-key-conflicts` fails the build if one of them quietly takes
#  over a tmux default. That check, not this comment, is what keeps the rule
#  true over time.
#
#  Bindings tmux already provides are NOT repeated here. Re-binding a key to
#  its own default is noise. Press `prefix + H` for the Key Explorer, or
#  `prefix + ?` for tmux's raw list, to see everything that is bound.
# ==============================================================================


# ------------------------------------------------------------------------------
#  Prefix
# ------------------------------------------------------------------------------

%if "#{!=:#{@cfg_prefix},C-b}"
  unbind C-b
  set -gF prefix "#{@cfg_prefix}"

  # Press the prefix twice to send it through to the program inside the pane
  # (nested tmux, or C-a in a shell).
  #
  # `bind` does not expand formats in the key argument, so the key cannot be
  # written as "#{@cfg_prefix}" directly. run-shell does expand them, which
  # keeps this correct for any prefix — not just C-a.
  run-shell -b 'tmux bind -N "Send the prefix key through to the pane" "#{@cfg_prefix}" send-prefix'
%endif

%if "#{==:#{@cfg_keep_default_prefix},on}"
  set -g prefix2 C-b
  bind -N "Send C-b through to the pane" C-b send-prefix -2
%endif


# ------------------------------------------------------------------------------
#  Configuration
# ------------------------------------------------------------------------------
#  Capital R, not r.
#
#  tmux binds `prefix r` to refresh-client, and this config leaves it alone.
#  A config that quietly redefines `r` is why the same keystroke does two
#  unrelated things depending on whose dotfiles you are sitting in front of.
#
#  The path matches the loader in tmux.conf. If you moved the config, change
#  it there and here.

bind -N "Reload the tmux config" R \
  source-file ~/.config/tmux/tmux.conf \; \
  display-message "  config reloaded"

# The Key Explorer — a searchable list of every key, in a native tmux popup.
# `prefix ?` still shows tmux's own raw output; this is the readable version.
bind -N "Open the Key Explorer" H \
  display-popup -E -w 80% -h 80% "~/.config/tmux/scripts/key-explorer"


# ------------------------------------------------------------------------------
#  Splits
# ------------------------------------------------------------------------------
#  `|` and `_` are mnemonic: the character looks like the split it makes.
#  The classic mnemonic pair is `|` and `-`, but `-` is tmux's delete-buffer,
#  so `_` takes that half — it draws the same line and tmux leaves it free.
#
#  `-c "#{pane_current_path}"` opens the new pane in the SAME directory as the
#  current one. tmux's default is your home directory, which is rarely wanted.

bind -N "Split side by side" | split-window -h -c "#{pane_current_path}"
bind -N "Split stacked"      _ split-window -v -c "#{pane_current_path}"

# Full-width / full-height splits across the whole window, on the Alt versions
# of the same two keys.
bind -N "Split full height, side by side" M-| split-window -fh -c "#{pane_current_path}"
bind -N "Split full width, stacked"      M-_ split-window -fv -c "#{pane_current_path}"

# tmux's own % and " keep working and keep their meaning — only the directory
# of the new pane changes. This is an enhancement, not a takeover.
bind -N "Split side by side, in the current directory" % split-window -h -c "#{pane_current_path}"
bind -N "Split stacked, in the current directory"     '"' split-window -v -c "#{pane_current_path}"

# Same reasoning for a new window.
bind -N "New window in the current directory" c new-window -c "#{pane_current_path}"


# ------------------------------------------------------------------------------
#  Pane navigation
# ------------------------------------------------------------------------------
#  NOTE on `l`: tmux binds it to last-window, and this is the one default this
#  config deliberately displaces — an h/j/k/l row with a hole in it is not a
#  row. last-window is not lost: it moves to `prefix Tab` below, and it comes
#  straight back if you set @cfg_vi_pane_keys to off.
#
#  This exception is recorded in keys/custom/navigation.tsv as
#  origin=tmux-override, and the Key Explorer shows you what it displaced.

%if "#{==:#{@cfg_vi_pane_keys},on}"
  bind -N "Select the pane to the left"  h select-pane -L
  bind -N "Select the pane below"        j select-pane -D
  bind -N "Select the pane above"        k select-pane -U
  bind -N "Select the pane to the right" l select-pane -R
%endif

# Resize, on the Alt row. Repeatable (`-r`), so you can hold the direction.
#
# These used to be H/J/K/L, which cost `prefix H` — now the Key Explorer — and
# gave the shifted letters two unrelated jobs. tmux's own `prefix M-Left` and
# friends do the same thing and still work; these are the vi-shaped spelling.
bind -r -N "Resize the pane left"  M-h resize-pane -L 5
bind -r -N "Resize the pane down"  M-j resize-pane -D 5
bind -r -N "Resize the pane up"    M-k resize-pane -U 5
bind -r -N "Resize the pane right" M-l resize-pane -R 5

# Move a pane out into its own window, and pull one back in.
# `-d` keeps you where you are instead of following the new window.
bind -N "Break the pane into a new window" ! break-pane -d
bind -N "Join a pane from another window"  @ choose-window "join-pane -h -s '%%'"

#  Not bound here, because tmux already provides them:
#    prefix z          zoom the pane
#    prefix M-1..M-5   even-horizontal, even-vertical, main-h, main-v, tiled
#    prefix Space      cycle layouts
#    prefix ;          last pane
#    prefix M-Arrow    resize by 5   /   prefix C-Arrow   resize by 1


# ------------------------------------------------------------------------------
#  Window navigation
# ------------------------------------------------------------------------------

bind -r -N "Previous window" C-h previous-window
bind -r -N "Next window"     C-l next-window

# Move the current window left/right in the window list.
#
# On the Alt versions, because plain `<` and `>` are tmux's window and pane
# menus — genuinely useful popups that a lot of configs stamp on by accident.
bind -r -N "Move the current window left"  M-< swap-window -d -t -1
bind -r -N "Move the current window right" M-> swap-window -d -t +1

# Where last-window lives, now that `l` selects a pane. Also just a good key.
bind -N "Jump to the last used window" Tab last-window

# Alt+number window switching, no prefix needed.
#
# TRADEOFF: `-n` bindings are global — tmux swallows these keys before the
# program in the pane ever sees them. Alt+1..9 is used by terminal browsers,
# some TUI apps, and Windows Terminal's own tab switching. Set
# @cfg_alt_window_keys to "off" in 00-options.conf if that bites you.
#
# These are Alt keys, not Ctrl keys, so rule 4 (never break Neovim) holds.

%if "#{==:#{@cfg_alt_window_keys},on}"
  bind -n -N "Go to window 1" M-1 select-window -t :=1
  bind -n -N "Go to window 2" M-2 select-window -t :=2
  bind -n -N "Go to window 3" M-3 select-window -t :=3
  bind -n -N "Go to window 4" M-4 select-window -t :=4
  bind -n -N "Go to window 5" M-5 select-window -t :=5
  bind -n -N "Go to window 6" M-6 select-window -t :=6
  bind -n -N "Go to window 7" M-7 select-window -t :=7
  bind -n -N "Go to window 8" M-8 select-window -t :=8
  bind -n -N "Go to window 9" M-9 select-window -t :=9
%endif


# ------------------------------------------------------------------------------
#  Neovim integration (vim-tmux-navigator)
# ------------------------------------------------------------------------------
#  Ctrl+hjkl moves between tmux panes AND Neovim splits with the same keys.
#  Needs the Neovim-side plugin as well — see docs/plugins/available.md#neovim-integration.
#
#  This is the ONLY place this config binds editor keys globally, and it is
#  off unless you ask for it. See rule 4 in docs/philosophy.md.
#
#  How it works: tmux asks "is the running program vim/nvim?" by matching the
#  process name. If yes, the key is passed through untouched and Neovim handles
#  it; if no, tmux moves the pane itself.

%if "#{==:#{@cfg_plugin_navigator},on}"
  is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|n?vim?x?)(-wrapped)?(diff)?$'"

  bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
  bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
  bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
  bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

  bind -T copy-mode-vi C-h select-pane -L
  bind -T copy-mode-vi C-j select-pane -D
  bind -T copy-mode-vi C-k select-pane -U
  bind -T copy-mode-vi C-l select-pane -R
%endif


# ------------------------------------------------------------------------------
#  Sessions
# ------------------------------------------------------------------------------
#  Nothing to rebind. tmux already has:
#    prefix s   choose a session      prefix $   rename the session
#    prefix d   detach                prefix (   /   prefix )   prev/next session
#
#  A scratch/popup shell over the current window (tmux 3.2+) is the one
#  addition — a quick command without disturbing your layout. Press again or
#  Ctrl-d to dismiss.

bind -N "Toggle a floating scratch terminal" g \
  display-popup -E -w 80% -h 75% -d "#{pane_current_path}"


# ------------------------------------------------------------------------------
#  Misc
# ------------------------------------------------------------------------------

bind -N "Toggle the status bar" b set -g status

# Clear both the visible screen and the scrollback buffer. The shell's own
# Ctrl-l clears only the screen and leaves the history behind.
bind -N "Clear the screen and the scrollback" C-k send-keys -R \; clear-history \; \
  display-message "  screen and history cleared"
