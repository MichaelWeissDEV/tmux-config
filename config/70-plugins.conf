# ==============================================================================
#  70-plugins.conf — optional plugins, vendored (no TPM)
# ==============================================================================
#
#  Reads:  @cfg_plugins and each @cfg_plugin_*
#
#  PLUGINS ARE OFF BY DEFAULT and nothing in this config depends on one.
#  Theming, clipboard, copy mode, capability detection and the status bar are
#  all plain tmux.
#
# ------------------------------------------------------------------------------
#  Why there is no TPM here
# ------------------------------------------------------------------------------
#  Plugins ship INSIDE this repository under vendor/, added with `git subtree`
#  and pinned in vendor-manifest/plugins.toml. Consequences, all deliberate:
#
#    * tmux never downloads anything at startup — clone once, works offline
#    * a plugin version is reproducible and traceable to a release
#    * an upstream force-push cannot change what your terminal does tomorrow
#    * no runtime dependency on a plugin manager
#
#  You update plugins by updating THIS repo (`git pull`), which brings a
#  snapshot that was tested together with the config.
#
#  Each plugin is loaded through an adapter in plugins/, never sourced
#  directly, so this project controls the integration. See docs/plugins/available.md.
# ==============================================================================


%if "#{==:#{@cfg_plugins},on}"

  source-file -q "~/.config/tmux/plugins/resurrect.conf"
  source-file -q "~/.config/tmux/plugins/continuum.conf"
  source-file -q "~/.config/tmux/plugins/navigator.conf"
  source-file -q "~/.config/tmux/plugins/open.conf"
  source-file -q "~/.config/tmux/plugins/sessionist.conf"
  source-file -q "~/.config/tmux/plugins/logging.conf"
  source-file -q "~/.config/tmux/plugins/extrakto.conf"
  source-file -q "~/.config/tmux/plugins/fpp.conf"

%endif
