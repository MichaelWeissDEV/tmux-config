# ==============================================================================
#  plugins/logging.conf — adapter for tmux-logging
# ==============================================================================
#  Log pane output to a file
#
#  Adapters exist so this project controls the integration: check the option,
#  check the vendored copy is present, set safe defaults, then load.
# ==============================================================================

%if "#{==:#{@cfg_plugin_logging},on}"

  if-shell -b '[ -f "$HOME/.config/tmux/vendor/tmux-logging/logging.tmux" ]' \
    'run-shell -b "$HOME/.config/tmux/vendor/tmux-logging/logging.tmux"'

  if-shell -b '[ ! -f "$HOME/.config/tmux/vendor/tmux-logging/logging.tmux" ]' \
    'display-message -d 0 "tmux-config: logging enabled but not vendored — see docs/plugins/available.md"'

%endif
