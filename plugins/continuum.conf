# ==============================================================================
#  plugins/continuum.conf — adapter for tmux-continuum
# ==============================================================================
#  Depends on resurrect. Continuum without it silently does nothing, so the
#  dependency is checked here and reported rather than left to the user.
# ==============================================================================

%if "#{==:#{@cfg_plugin_continuum},on}"

  # Dependency check. We do NOT auto-enable resurrect: quietly turning on a
  # second plugin because you asked for the first is exactly the kind of hidden
  # behaviour this project avoids. Tell the user instead.
  %if "#{!=:#{@cfg_plugin_resurrect},on}"
    display-message -d 0 "tmux-config: @cfg_plugin_continuum needs @cfg_plugin_resurrect — enable it too"
  %endif

  %if "#{==:#{@cfg_plugin_resurrect},on}"
    set -g @continuum-restore 'on'
    set -g @continuum-save-interval '15'

    if-shell -b '[ -f "$HOME/.config/tmux/vendor/tmux-continuum/continuum.tmux" ]' \
      'run-shell -b "$HOME/.config/tmux/vendor/tmux-continuum/continuum.tmux"'

    if-shell -b '[ ! -f "$HOME/.config/tmux/vendor/tmux-continuum/continuum.tmux" ]' \
      'display-message -d 0 "tmux-config: continuum enabled but not vendored — see docs/plugins/available.md"'
  %endif

%endif
