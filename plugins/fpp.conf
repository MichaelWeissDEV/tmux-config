# ==============================================================================
#  plugins/fpp.conf — adapter for tmux-fpp
# ==============================================================================
#  Pick a file path out of pane output
#
#  Adapters exist so this project controls the integration: check the option,
#  check the vendored copy is present, set safe defaults, then load.
# ==============================================================================

%if "#{==:#{@cfg_plugin_fpp},on}"

  # tmux-fpp needs `fpp` on PATH. Without it the plugin loads but its
  # bindings do nothing — a silent failure, so it is reported instead.
  if-shell -b '! command -v fpp >/dev/null 2>&1' \
    'display-message -d 0 "tmux-config: @cfg_plugin_fpp needs fpp on PATH"'

  if-shell -b '[ -f "$HOME/.config/tmux/vendor/tmux-fpp/fpp.tmux" ]' \
    'run-shell -b "$HOME/.config/tmux/vendor/tmux-fpp/fpp.tmux"'

  if-shell -b '[ ! -f "$HOME/.config/tmux/vendor/tmux-fpp/fpp.tmux" ]' \
    'display-message -d 0 "tmux-config: fpp enabled but not vendored — see docs/plugins/available.md"'

%endif
