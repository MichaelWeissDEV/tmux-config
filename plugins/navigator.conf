# ==============================================================================
#  plugins/navigator.conf — adapter for vim-tmux-navigator
# ==============================================================================
#
#  THIS IS THE ONE PLUGIN THAT BREAKS THE INPUT-SAFETY RULE, deliberately and
#  only when you ask for it.
#
#  It binds Ctrl-h/j/k/l in the ROOT table, meaning tmux sees those keys before
#  the program in your pane does. It then inspects the running process and
#  forwards the key when that process is vim/nvim. That works well, but it is
#  interception, and `scripts/check` will report it as such — correctly.
#
#  Needs the Neovim half as well, or Ctrl-hjkl inside Neovim does nothing:
#      { "christoomey/vim-tmux-navigator", lazy = false }
# ==============================================================================

%if "#{==:#{@cfg_plugin_navigator},on}"

  if-shell -b '[ -f "$HOME/.config/tmux/vendor/vim-tmux-navigator/vim-tmux-navigator.tmux" ]' \
    'run-shell -b "$HOME/.config/tmux/vendor/vim-tmux-navigator/vim-tmux-navigator.tmux"'

  if-shell -b '[ ! -f "$HOME/.config/tmux/vendor/vim-tmux-navigator/vim-tmux-navigator.tmux" ]' \
    'display-message -d 0 "tmux-config: navigator enabled but not vendored — see docs/plugins/available.md"'

%endif
