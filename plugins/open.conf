# ==============================================================================
#  plugins/open.conf — adapter for tmux-open
# ==============================================================================
#  Adds `o` (open) and `C-o` (open in editor) inside copy mode.
# ==============================================================================

%if "#{==:#{@cfg_plugin_open},on}"

  if-shell -b '[ -f "$HOME/.config/tmux/vendor/tmux-open/open.tmux" ]' \
    'run-shell -b "$HOME/.config/tmux/vendor/tmux-open/open.tmux"'

  if-shell -b '[ ! -f "$HOME/.config/tmux/vendor/tmux-open/open.tmux" ]' \
    'display-message -d 0 "tmux-config: open enabled but not vendored — see docs/plugins/available.md"'

%endif
