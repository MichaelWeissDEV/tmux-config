# ==============================================================================
#  plugins/sessionist.conf — adapter for tmux-sessionist
# ==============================================================================
#  Session management without leaving the current session.
#
#  NOTE: it binds prefix+C, prefix+X, prefix+S and others. prefix+S is already
#  used by this config for `choose-tree`. `scripts/check` reports the clash if
#  one appears — that is the intended way to find out, rather than discovering
#  it mid-workflow.
# ==============================================================================

%if "#{==:#{@cfg_plugin_sessionist},on}"

  if-shell -b '[ -f "$HOME/.config/tmux/vendor/tmux-sessionist/sessionist.tmux" ]' \
    'run-shell -b "$HOME/.config/tmux/vendor/tmux-sessionist/sessionist.tmux"'

  if-shell -b '[ ! -f "$HOME/.config/tmux/vendor/tmux-sessionist/sessionist.tmux" ]' \
    'display-message -d 0 "tmux-config: sessionist enabled but not vendored — see docs/plugins.md"'

%endif
