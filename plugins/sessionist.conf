# ==============================================================================
#  plugins/sessionist.conf — adapter for tmux-sessionist
# ==============================================================================
#  Session management without leaving the current session.
#
#  CONFLICTS — measured against the vendored snapshot, not guessed:
#
#    S  choose-tree -Zs        -> switch-client -l
#    g  scratch popup          -> goto-session prompt
#    @  join-pane              -> promote pane to session
#    C  customize-mode         -> new-session prompt
#    t  clock-mode             -> join pane
#
#  Losing prefix+g and prefix+S is what people notice. Restore them in
#  local.conf, which loads after this file. See docs/plugins/available.md#binding-conflicts.
#
#  `./tests/run` re-derives this list, so it stays honest when the snapshot
#  is updated. `scripts/check` cannot: it runs with plugins off.
# ==============================================================================

%if "#{==:#{@cfg_plugin_sessionist},on}"

  if-shell -b '[ -f "$HOME/.config/tmux/vendor/tmux-sessionist/sessionist.tmux" ]' \
    'run-shell -b "$HOME/.config/tmux/vendor/tmux-sessionist/sessionist.tmux"'

  if-shell -b '[ ! -f "$HOME/.config/tmux/vendor/tmux-sessionist/sessionist.tmux" ]' \
    'display-message -d 0 "tmux-config: sessionist enabled but not vendored — see docs/plugins/available.md"'

%endif
