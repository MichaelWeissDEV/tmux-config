# ==============================================================================
#  plugins/resurrect.conf — adapter for tmux-resurrect
# ==============================================================================
#  Adapters exist so WE control the integration, not the plugin. Each one:
#    1. checks its @cfg_plugin_* option
#    2. checks the vendored copy is actually present
#    3. sets conservative defaults BEFORE loading
#    4. loads the entrypoint
#  Never source vendor/ directly from tmux.conf.
# ==============================================================================

%if "#{==:#{@cfg_plugin_resurrect},on}"

  # Restore running programs, not just the layout. The list is deliberately
  # short: restoring arbitrary commands at boot runs whatever was in a pane
  # when you last saved, which is a genuine footgun on a shared machine.
  set -g @resurrect-processes 'ssh psql mysql sqlite3 top htop btop'
  set -g @resurrect-capture-pane-contents 'on'
  set -g @resurrect-strategy-nvim 'session'

  if-shell -b '[ -f "$HOME/.config/tmux/vendor/tmux-resurrect/resurrect.tmux" ]' \
    'run-shell -b "$HOME/.config/tmux/vendor/tmux-resurrect/resurrect.tmux"'

  if-shell -b '[ ! -f "$HOME/.config/tmux/vendor/tmux-resurrect/resurrect.tmux" ]' \
    'display-message -d 0 "tmux-config: resurrect enabled but not vendored — see docs/plugins/available.md"'

%endif
