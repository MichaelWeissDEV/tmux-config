# ==============================================================================
#  plugins/extrakto.conf — adapter for extrakto
# ==============================================================================
#  Fuzzy-find and copy text from the screen
#
#  Adapters exist so this project controls the integration: check the option,
#  check the vendored copy is present, set safe defaults, then load.
# ==============================================================================

%if "#{==:#{@cfg_plugin_extrakto},on}"

  # extrakto needs `fzf` on PATH. Without it the plugin loads but its
  # bindings do nothing — a silent failure, so it is reported instead.
  if-shell -b '! command -v fzf >/dev/null 2>&1' \
    'display-message -d 0 "tmux-config: @cfg_plugin_extrakto needs fzf on PATH"'

  if-shell -b '[ -f "$HOME/.config/tmux/vendor/extrakto/extrakto.tmux" ]' \
    'run-shell -b "$HOME/.config/tmux/vendor/extrakto/extrakto.tmux"'

  if-shell -b '[ ! -f "$HOME/.config/tmux/vendor/extrakto/extrakto.tmux" ]' \
    'display-message -d 0 "tmux-config: extrakto enabled but not vendored — see docs/plugins/available.md"'

%endif
